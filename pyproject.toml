[project]
name = "ssm-v4"
version = "0.1.0"
description = "SSM V4 - Korean Stock Market Risk, Opportunity and Portfolio Decision Support System"
requires-python = ">=3.13,<3.14"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "tests",
    "backend/tests",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"